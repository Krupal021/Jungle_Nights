<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Jungle Night — A Game Boy Style Adventure</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f380f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Jungle Night" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<style>
  :root{
    --shell:#c4c0a8;
    --shell-dark:#9a9680;
    --shell-shadow:#7d7a68;
    --screen-border:#3a3a3a;
    --btn-red:#8b3a4a;
    --accent:#4a4a7a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:#1a1a1a;
    display:flex;align-items:center;justify-content:center;
    font-family:'Courier New', monospace;
    color:#eee;
    -webkit-user-select:none;user-select:none;
  }
  .console{
    background:linear-gradient(160deg,var(--shell) 0%, var(--shell-dark) 100%);
    border-radius:18px 18px 40px 18px;
    padding:22px 22px 34px 22px;
    box-shadow: 0 10px 0 var(--shell-shadow), 0 20px 40px rgba(0,0,0,.6);
    width:520px;
    max-width:94vw;
  }
  .brand{
    text-align:right;
    font-style:italic;
    font-weight:bold;
    color:#4a4a7a;
    letter-spacing:1px;
    font-size:13px;
    margin-bottom:6px;
    padding-right:6px;
  }
  .screen-frame{
    position:relative;
    background:var(--screen-border);
    border-radius:8px;
    padding:14px 14px 18px 14px;
    box-shadow: inset 0 0 0 3px #222, inset 0 0 10px rgba(0,0,0,.8);
  }
  .screen-label{
    display:flex;justify-content:space-between;align-items:center;
    padding:0 4px 8px 4px;
    font-size:10px;
    color:#8a8a9a;
    letter-spacing:2px;
  }
  #gameCanvas{
    display:block;
    width:100%;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background:#9bbc0f;
    border-radius:2px;
  }
  .controls-row{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:22px;
    padding:0 6px;
  }
  .dpad{
    position:relative;
    width:100px;height:100px;
  }
  .dpad div{
    position:absolute;
    background:#2b2b2b;
    box-shadow: 0 2px 0 #000;
  }
  .dpad .v{ width:32px;height:100px;left:34px;top:0;border-radius:6px; }
  .dpad .h{ width:100px;height:32px;left:0;top:34px;border-radius:6px; }
  .ab-group{
    display:flex;gap:14px;align-items:flex-end;
    transform: rotate(-18deg);
  }
  .round-btn{
    width:46px;height:46px;border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #a94a5a, var(--btn-red) 60%, #6e2735);
    box-shadow: 0 4px 0 #5a2530, inset 0 -2px 4px rgba(0,0,0,.3);
    display:flex;align-items:center;justify-content:center;
    font-weight:bold;color:#3a1520;font-size:14px;
  }
  .meta-row{
    display:flex;justify-content:center;gap:26px;margin-top:18px;
  }
  .pill{
    background:#2b2b2b;color:#ccc;font-size:9px;letter-spacing:1px;
    padding:6px 14px;border-radius:10px;
    box-shadow:0 2px 0 #111;
    text-align:center;
  }
  .pill b{display:block;font-size:10px;color:#eee;margin-top:2px;}
  .footer-note{
    text-align:center;margin-top:16px;font-size:10px;color:#6a6a5a;letter-spacing:1px;
  }
  .keys{
    text-align:center;
    font-size:10px;
    color:#5a5a4a;
    margin-top:4px;
    letter-spacing:.5px;
  }

  /* ---------- TOUCH / ANDROID MODE ---------- */
  #touchControls{ display:none; }
  body.touch-mode{
    display:block;
    padding:0;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:none;
  }
  body.touch-mode .console{
    width:100vw;
    max-width:100vw;
    height:100vh;
    height:100dvh;
    border-radius:0;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom)) 8px;
    box-shadow:none;
    display:flex;
    flex-direction:column;
  }
  body.touch-mode .brand,
  body.touch-mode .controls-row,
  body.touch-mode .meta-row,
  body.touch-mode .footer-note,
  body.touch-mode .keys{
    display:none;
  }
  body.touch-mode .screen-frame{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
    min-height:0;
  }
  body.touch-mode .screen-label{ display:none; }
  body.touch-mode #gameCanvas{
    width:auto;
    height:auto;
    max-width:100%;
    max-height:100%;
    aspect-ratio: 480 / 432;
  }
  body.touch-mode #touchControls{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    padding:10px 6px calc(6px + env(safe-area-inset-bottom)) 6px;
    flex:0 0 auto;
    touch-action:none;
  }
  .tc-dpad{
    position:relative;
    width:132px;height:132px;
    flex:0 0 auto;
  }
  .tc-btn{
    position:absolute;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#3a3a3a,#1c1c1c);
    border:2px solid #4a4a4a;
    color:#cfcfcf;
    font-size:18px;
    border-radius:8px;
    box-shadow:0 3px 0 #000;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  .tc-btn:active, .tc-btn.pressed{
    background:linear-gradient(160deg,#5a5a5a,#2c2c2c);
    transform:translateY(2px);
    box-shadow:0 1px 0 #000;
  }
  .tc-up{ top:0; left:44px; width:44px;height:44px; }
  .tc-down{ top:88px; left:44px; width:44px;height:44px; }
  .tc-left{ top:44px; left:0; width:44px;height:44px; }
  .tc-right{ top:44px; left:88px; width:44px;height:44px; }
  .tc-actions{
    display:flex;flex-direction:column;align-items:center;gap:10px;
    flex:0 0 auto;
  }
  .tc-abgroup{ display:flex; gap:16px; }
  .tc-round{
    width:64px;height:64px;border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:20px;line-height:1;
    box-shadow:0 4px 0 #5a2530, inset 0 -2px 4px rgba(0,0,0,.3);
    -webkit-tap-highlight-color: transparent;
    user-select:none;
  }
  .tc-round span{ font-size:8px;letter-spacing:1px;margin-top:2px; }
  .tc-attack{ background:radial-gradient(circle at 35% 30%,#a94a5a,var(--btn-red) 60%,#6e2735); color:#fbe4e4; }
  .tc-heal{ background:radial-gradient(circle at 35% 30%,#5aa958,#2f7d2e 60%,#1c4e1b); color:#e4fbe4; }
  .tc-attack:active, .tc-heal:active{ transform:translateY(2px); }
  .tc-mid{ display:flex; gap:10px; }
  .tc-small{
    background:#2b2b2b;color:#ccc;font-size:9px;letter-spacing:1px;
    padding:6px 10px;border-radius:8px;box-shadow:0 2px 0 #111;
    -webkit-tap-highlight-color: transparent;
  }

  /* ---------- NAME ENTRY OVERLAY ---------- */
  #nameOverlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(6,10,6,0.82);
    z-index:20;
    padding:16px;
  }
  #nameOverlay.hidden{ display:none; }
  .name-card{
    background:#0f380f;
    border:3px solid #9bbc0f;
    border-radius:6px;
    padding:22px 20px;
    width:280px;
    max-width:88%;
    text-align:center;
    box-shadow:0 6px 0 rgba(0,0,0,.5);
  }
  .name-card h2{
    color:#9bbc0f;
    font-family:'Courier New', monospace;
    font-size:14px;
    letter-spacing:1px;
    margin:0 0 6px 0;
  }
  .name-card p{
    color:#7ea87e;
    font-size:10px;
    margin:0 0 16px 0;
    letter-spacing:.5px;
  }
  #nameInput{
    width:100%;
    font-family:'Courier New', monospace;
    font-size:15px;
    letter-spacing:1px;
    text-align:center;
    text-transform:uppercase;
    background:#183d18;
    color:#e8ffe8;
    border:2px solid #6a9a6a;
    border-radius:4px;
    padding:10px 8px;
    outline:none;
    box-sizing:border-box;
  }
  #nameInput::placeholder{ color:#5a8a5a; text-transform:none; }
  #nameInput:focus{ border-color:#e8c840; }
  #nameGo{
    margin-top:14px;
    width:100%;
    background:linear-gradient(160deg,#a94a5a,#8b3a4a 60%,#6e2735);
    color:#fff0f0;
    border:none;
    border-radius:6px;
    padding:11px;
    font-family:'Courier New', monospace;
    font-weight:bold;
    font-size:12px;
    letter-spacing:1px;
    box-shadow:0 3px 0 #5a2530;
    cursor:pointer;
  }
  #nameGo:active{ transform:translateY(2px); box-shadow:0 1px 0 #5a2530; }
</style>
</head>
<body>

<div class="console">
  <div class="brand">GAME•BOY <span style="color:#8b3a4a">JUNGLE</span></div>
  <div class="screen-frame">
    <div class="screen-label"><span>◉ POWER</span><span>JUNGLE NIGHT</span></div>
    <canvas id="gameCanvas" width="480" height="432"></canvas>

    <div id="nameOverlay">
      <form class="name-card" id="nameForm">
        <h2>WHO'S EXPLORING TODAY?</h2>
        <p>Enter your name</p>
        <input id="nameInput" type="text" maxlength="12" placeholder="e.g. Priya" autocomplete="off" autocapitalize="words" />
        <button id="nameGo" type="submit">START ADVENTURE</button>
      </form>
    </div>
  </div>

  <div id="touchControls">
    <div class="tc-dpad">
      <div class="tc-btn tc-up" data-key="arrowup">▲</div>
      <div class="tc-btn tc-down" data-key="arrowdown">▼</div>
      <div class="tc-btn tc-left" data-key="arrowleft">◀</div>
      <div class="tc-btn tc-right" data-key="arrowright">▶</div>
    </div>
    <div class="tc-actions">
      <div class="tc-mid">
        <div class="tc-small" id="tcMute">MUTE</div>
        <div class="tc-small" id="tcStart">START</div>
        <div class="tc-small" id="tcRun">RUN</div>
      </div>
      <div class="tc-abgroup">
        <div class="tc-round tc-heal" data-key="x">🍎<span>HEAL</span></div>
        <div class="tc-round tc-attack" data-key="z">⚔<span>ATTACK</span></div>
      </div>
    </div>
  </div>

  <div class="controls-row">
    <div class="dpad">
      <div class="v"></div>
      <div class="h"></div>
    </div>
    <div class="ab-group">
      <div class="round-btn">B</div>
      <div class="round-btn">A</div>
    </div>
  </div>

  <div class="meta-row">
    <div class="pill">SELECT<b>M = MUTE</b></div>
    <div class="pill">START<b>ENTER</b></div>
  </div>

  <div class="keys">ARROWS / WASD = MOVE &nbsp;•&nbsp; Z (A) = ATTACK &nbsp;•&nbsp; X (B) = EAT APPLE &nbsp;•&nbsp; R = RUN</div>
  <div class="footer-note">FAN-MADE HOMEBREW • NOT AN OFFICIAL NINTENDO PRODUCT</div>
</div>

<script>
"use strict";

/* =========================================================
   JUNGLE NIGHT — retro Game Boy style survival adventure
   Single-file HTML5 canvas game, no external assets.
   ========================================================= */

// ---------- CANVAS SETUP ----------
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = canvas.width, H = canvas.height;

// ---------- PALETTE ----------
const PAL = {
  bgSkyDay:   '#9bbc0f',
  bgSkyNight: '#0f1a2a',
  groundDay1: '#3f6b3f',
  groundDay2: '#356035',
  groundNight1: '#16241c',
  groundNight2: '#101c16',
  trunk: '#5a3921',
  trunkDark: '#3d2614',
  leaf1: '#2e7d32',
  leaf2: '#1b5e20',
  leaf3: '#4a9c4e',
  bush: '#2e6b2e',
  skin: '#c98a5b',
  skinShadow: '#a06a3f',
  skinHi: '#e0a878',
  hair: '#1c1108',
  girlTop: '#c0392b',
  girlTop2: '#e0684f',
  girlBottom: '#2c3e8c',
  manShirt: '#2e7d32',
  manShirt2: '#1b5e20',
  manPants: '#5a4530',
  outline: '#1a1a1a',
  eyeWhite: '#f4f4e4',
  eyeBlack: '#1a1a1a',
  wood: '#8a5a2a',
  stone: '#8a8a8a',
  stoneHi: '#b0b0b0',
  apple: '#c0392b',
  appleLeaf: '#3f8f3f',
  swordBlade: '#d8d8e0',
  swordHilt: '#8a5a2a',
  monster: '#4a2545',
  monsterDark: '#2e1830',
  monsterEye: '#ff3333',
  ui: '#0f380f',
  uiLight: '#9bbc0f',
  hpRed: '#c0392b',
  hpYellow: '#d4a017',
  hpGreen: '#3f8f3f',
  white: '#f4f4e4',
  black: '#0a0a0a',
  grassDay: '#2f6b2a',
  grassDayHi: '#4a9c4e',
  grassNight: '#0f2412',
  grassNightHi: '#1c3a1e',
  dirt: '#8a6a3a',
  dirtDark: '#6e5228',
  water: '#3a7ca5',
  waterDark: '#245a7d',
  waterHi: '#7fc4e0'
};

// ---------- AUDIO (WebAudio chiptune sfx + tiny loops) ----------
const AudioSys = (() => {
  let ctxA = null, muted = false, masterGain = null;
  function ensure(){
    if(!ctxA){
      ctxA = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = ctxA.createGain();
      masterGain.gain.value = 0.22;
      masterGain.connect(ctxA.destination);
    }
    if(ctxA.state === 'suspended') ctxA.resume();
  }
  function tone(freq, dur, type='square', vol=1, delay=0, slideTo=null){
    if(muted) return;
    ensure();
    const t0 = ctxA.currentTime + delay;
    const osc = ctxA.createOscillator();
    const g = ctxA.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if(slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(g); g.connect(masterGain);
    osc.start(t0); osc.stop(t0+dur+0.02);
  }
  const sfx = {
    step(){ tone(180+Math.random()*30, 0.03, 'square', 0.15); },
    pickup(){ tone(660,0.06,'square',0.5); tone(880,0.08,'square',0.5,0.06); },
    craft(){ [440,554,659,880].forEach((f,i)=>tone(f,0.09,'square',0.5,i*0.08)); },
    attack(){ tone(120,0.08,'sawtooth',0.6,0,60); },
    hit(){ tone(200,0.12,'square',0.6,0,60); },
    hurt(){ tone(160,0.18,'sawtooth',0.5,0,50); },
    heal(){ [523,659,784].forEach((f,i)=>tone(f,0.1,'triangle',0.4,i*0.07)); },
    nightFall(){ tone(220,0.6,'sawtooth',0.35,0,60); tone(110,0.8,'sine',0.3,0.1,50); },
    found(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.12,'square',0.4,i*0.1)); },
    victory(){ [523,659,784,1046,1318].forEach((f,i)=>tone(f,0.16,'square',0.45,i*0.13)); },
    gameover(){ [392,349,294,220,196].forEach((f,i)=>tone(f,0.22,'sawtooth',0.4,i*0.18)); },
    monster(){ tone(80+Math.random()*20,0.3,'sawtooth',0.3); },
    select(){ tone(760,0.05,'square',0.35); }
  };

  // tiny background loop scheduler
  let loopTimer = null, loopStep = 0;
  const dayNotes   = [392,0,440,0,523,0,440,392, 349,0,392,0,440,0,392,349];
  const nightNotes = [196,0,0,220,0,0,196,0, 174,0,0,196,0,0,174,0];
  function startLoop(mode){
    stopLoop();
    loopStep = 0;
    const notes = mode === 'night' ? nightNotes : dayNotes;
    const tempo = mode === 'night' ? 260 : 200;
    loopTimer = setInterval(()=>{
      if(muted){ loopStep=(loopStep+1)%notes.length; return; }
      const f = notes[loopStep % notes.length];
      if(f>0) tone(f, tempo/1000*0.8, mode==='night'?'triangle':'square', mode==='night'?0.16:0.12);
      loopStep++;
    }, tempo);
  }
  function stopLoop(){ if(loopTimer){ clearInterval(loopTimer); loopTimer=null; } }
  function toggleMute(){ muted = !muted; return muted; }
  return { sfx, startLoop, stopLoop, toggleMute, ensure, get muted(){return muted;} };
})();

// ---------- INPUT ----------
const keys = {};
window.addEventListener('keydown', e=>{
  if(document.activeElement && document.activeElement.tagName==='INPUT') return; // let the name field type normally
  keys[e.key.toLowerCase()] = true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  if(e.key.toLowerCase()==='m'){ const m = AudioSys.toggleMute(); }
  if(e.key.toLowerCase()==='enter') Game.onStart();
  if(e.key.toLowerCase()==='r' && (Game.state==='COMBAT'||Game.state==='WILD_BATTLE')) Game.attemptRun();
  AudioSys.ensure();
});
window.addEventListener('keyup', e=>{
  if(document.activeElement && document.activeElement.tagName==='INPUT') return;
  keys[e.key.toLowerCase()] = false;
});
canvas.addEventListener('click', ()=>AudioSys.ensure());

// ---------- NAME ENTRY ----------
const nameOverlay = document.getElementById('nameOverlay');
const nameForm = document.getElementById('nameForm');
const nameInput = document.getElementById('nameInput');
setTimeout(()=>{ try{ nameInput.focus(); }catch(e){} }, 300);
nameForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  AudioSys.ensure();
  let n = (nameInput.value || '').trim();
  n = n.replace(/[^a-zA-Z0-9 '\-]/g,'').slice(0,12);
  Game.playerName = n.length ? n : 'Explorer';
  nameOverlay.classList.add('hidden');
  Game.state = 'TITLE';
  AudioSys.sfx.select();
});

function down(...names){ return names.some(n=>keys[n]); }

// ---------- TOUCH / ANDROID CONTROLS ----------
const isTouchDevice = (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) || ('ontouchstart' in window);
if(isTouchDevice){
  document.body.classList.add('touch-mode');
}
document.querySelectorAll('.tc-btn, .tc-round').forEach(btn=>{
  const key = btn.dataset.key;
  if(!key) return;
  const press = (e)=>{ e.preventDefault(); keys[key]=true; btn.classList.add('pressed'); AudioSys.ensure(); };
  const release = (e)=>{ if(e) e.preventDefault(); keys[key]=false; btn.classList.remove('pressed'); };
  btn.addEventListener('touchstart', press, {passive:false});
  btn.addEventListener('touchend', release, {passive:false});
  btn.addEventListener('touchcancel', release, {passive:false});
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
});
const tcStart = document.getElementById('tcStart');
if(tcStart) tcStart.addEventListener('click', ()=>{ AudioSys.ensure(); Game.onStart(); });
const tcMute = document.getElementById('tcMute');
if(tcMute) tcMute.addEventListener('click', ()=>{
  const m = AudioSys.toggleMute();
  tcMute.textContent = m ? 'UNMUTE' : 'MUTE';
});
const tcRun = document.getElementById('tcRun');
if(tcRun) tcRun.addEventListener('click', ()=>{
  AudioSys.ensure();
  if(Game.state==='COMBAT'||Game.state==='WILD_BATTLE') Game.attemptRun();
});
// prevent page scroll/zoom gestures while playing on touch devices
document.addEventListener('touchmove', (e)=>{ if(document.body.classList.contains('touch-mode')) e.preventDefault(); }, {passive:false});
document.addEventListener('gesturestart', (e)=>e.preventDefault());
canvas.addEventListener('touchstart', ()=>AudioSys.ensure(), {passive:true});

// ---------- PWA: register service worker (installable + offline on Android) ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{
      // fails silently if opened via file:// or unsupported context — game still works fine
    });
  });
}

// ---------- UTILITY ----------
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function lerp(a,b,t){ return a+(b-a)*t; }

// ---------- PIXEL SPRITE DRAWING (rect-composed, GB-blocky style) ----------
function px(x,y,w,h,color){
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function drawGirl(x,y,facing,walkT,attacking,hasSword,fainted){
  const s = 3; // pixel unit
  const bob = fainted ? 0 : Math.sin(walkT*10)* (Math.abs(Math.sin(walkT*10))>0.15?1:0);
  const yy = y + (fainted? 10: -Math.abs(bob));
  const flip = facing === 'left';
  ctx.save();
  if(flip){ ctx.translate(x+16*s, 0); ctx.scale(-1,1); }
  const oy = yy;
  const gx = flip ? 0 : x;
  // Legs
  px(gx+4*s, oy+11*s, 2*s,3*s, PAL.girlBottom);

// ---------- UPDATE ----------
function updatePlayer(dt){
  const p = Game.player;
  let dx=0, dy=0;
  if(down('arrowleft','a')) dx-=1;
  if(down('arrowright','d')) dx+=1;
  if(down('arrowup','w')) dy-=1;
  if(down('arrowdown','s')) dy+=1;
  const moving = dx!==0 || dy!==0;
  if(moving){
    const len = Math.hypot(dx,dy);
    dx/=len; dy/=len;
    if(dx<0) p.facing='left'; else if(dx>0) p.facing='right';
    const nx = p.x + dx*p.speed*dt*60;
    const ny = p.y + dy*p.speed*dt*60;
    const testX = {x:nx,y:p.y,w:p.w,h:p.h};
    const testY = {x:p.x,y:ny,w:p.w,h:p.h};
    let blockedX=false, blockedY=false;
    for(const tr of trees){
      const tb = {x:tr.x, y:tr.y+tr.h-14, w:tr.w, h:16};
      if(rectsOverlap(testX,tb)) blockedX=true;
      if(rectsOverlap(testY,tb)) blockedY=true;
    }
    for(const rk of rocks){
      if(rectsOverlap(testX,rk)) blockedX=true;
      if(rectsOverlap(testY,rk)) blockedY=true;
    }
    if(!blockedX) p.x = clamp(nx, 4, W-p.w-4);
    if(!blockedY) p.y = clamp(ny, 24, H-p.h-40);
    p.walkT += dt;
  }
  p.attackT = Math.max(0, p.attackT - dt);
  p.hurtT = Math.max(0, p.hurtT - dt);
  return moving;
}

function updateExplore(dt){
  const moving = updatePlayer(dt);
  Game.dayTimer -= dt;
  const p = Game.player;

  // items
  for(const it of Game.items){
    if(it.taken) continue;
    const ib = {x:it.x,y:it.y,w:12,h:12};
    if(rectsOverlap({x:p.x,y:p.y,w:p.w,h:p.h}, ib)){
      it.taken = true;
      if(it.type==='stick') Game.sticks++;
      if(it.type==='stone') Game.stones++;
      if(it.type==='apple') Game.apples++;
      AudioSys.sfx.pickup();
      Game.craftCheck();
    }
  }

  // find friend
  if(!Game.friend.found){
    const fb = {x:Game.friend.fx, y:Game.friend.fy, w:Game.friend.w, h:Game.friend.h};
    if(rectsOverlap({x:p.x,y:p.y,w:p.w,h:p.h}, fb)){
      Game.friend.found = true;
      Game.friend.active = true;
      AudioSys.sfx.found();
      Game.showMessage("You found your friend! Stay close.", 2.5);
    }
  } else if(Game.friend.active){
    // simple follow AI
    const f = Game.friend;
    const targetX = p.x - 34, targetY = p.y;
    const dx = targetX - f.x, dy = targetY - f.y;
    const d = Math.hypot(dx,dy);
    if(d>6){
      f.x += (dx/d)*1.6*dt*60;
      f.y += (dy/d)*1.6*dt*60;
      f.facing = dx<0?'left':'right';
      f.walkT += dt;
    }
  }

  if(Game.messageT>0) Game.messageT -= dt;

  // Fire Red style: tall grass has a chance to trigger a wild encounter
  if(Game.encounterCooldown>0) Game.encounterCooldown -= dt;
  else if(moving){
    const pc = {x:p.x+p.w/2, y:p.y+p.h/2};
    const inGrass = grassPatches.some(g => pc.x>g.x && pc.x<g.x+g.w && pc.y>g.y && pc.y<g.y+g.h);
    if(inGrass && Math.random() < dt*0.35){
      Game.startWildEncounter();
      return;
    }
  }

  if(Game.dayTimer<=0){
    Game.triggerNight();
  }
}

function getBattleEnemy(){
  return Game.battleMode==='wild' ? Game.wildCritter : Game.monster;
}

function tryAttack(){
  const p = Game.player;
  if(p.attackT>0) return;
  p.attackT = 0.35;
  AudioSys.sfx.attack();
  const enemy = getBattleEnemy();
  if(!enemy) return;
  const active = Game.battleMode==='wild' ? true : Game.monster.active;
  const range = {x:p.x-14, y:p.y-10, w:p.w+28, h:p.h+20};
  const ew = enemy.w||54, eh = enemy.h||48;
  if(active && !enemy.dead && rectsOverlap(range, {x:enemy.x,y:enemy.y,w:ew,h:eh})){
    const dmg = Game.hasSword ? 15 : 5;
    enemy.hp = Math.max(0, enemy.hp - dmg);
    Game.shake = 6;
    AudioSys.sfx.hit();
    if(enemy.hp<=0){ enemy.dead = true; }
  }
}

function updateCombat(dt){
  updatePlayer(dt);
  const p = Game.player, f = Game.friend, m = Game.monster;

  if(down('z') ) tryAttack();

  if(down('x')){
    if(Game.apples>0 && p.hp < p.maxHp){
      Game.apples--; p.hp = Math.min(p.maxHp, p.hp+30);
      AudioSys.sfx.heal();
      Game.showMessage("Ate an apple! +30 HP", 1.2);
      keys['x']=false;
    }
  }

  // friend follow + auto attack
  if(f.active && !f.fainted){
    const targetX = p.x - 34, targetY = p.y+6;
    const dx = targetX - f.x, dy = targetY - f.y;
    const d = Math.hypot(dx,dy);
    if(d>8){
      f.x += (dx/d)*1.8*dt*60;
      f.y += (dy/d)*1.8*dt*60;
      f.facing = dx<0?'left':'right';
      f.walkT += dt;
    }
    f.attackCd -= dt;
    if(!m.dead && m.active && f.attackCd<=0 && dist(f,m)<70){
      f.attackCd = 1.1;
      m.hp = Math.max(0, m.hp-8);
      AudioSys.sfx.hit();
      if(m.hp<=0) m.dead=true;
    }
    f.hurtT = Math.max(0, f.hurtT-dt);
  }

  // monster AI
  if(m.active && !m.dead){
    // chase closest active target
    const targets = [];
    targets.push({ref:p, x:p.x, y:p.y});
    if(f.active && !f.fainted) targets.push({ref:f, x:f.x, y:f.y});
    targets.sort((a,b)=>dist(m,a)-dist(m,b));
    const tgt = targets[0];
    const dx = tgt.x - m.x, dy = tgt.y - m.y;
    const d = Math.hypot(dx,dy) || 1;
    m.x += (dx/d)*m.speed*dt*60;
    m.y += (dy/d)*m.speed*dt*60;
    m.x = clamp(m.x, 4, W-58);
    m.y = clamp(m.y, 24, H-90);

    m.attackCd -= dt;
    if(d<48 && m.attackCd<=0){
      m.attackCd = 1.0;
      const dmg = 10;
      tgt.ref.hp = Math.max(0, tgt.ref.hp-dmg);
      tgt.ref.hurtT = 0.35;
      Game.shake = 8;
      AudioSys.sfx.hurt();
      if(tgt.ref===f && f.hp<=0){ f.fainted=true; Game.showMessage("Your friend went down!", 2); }
    }
  }

  if(Game.messageT>0) Game.messageT -= dt;
  Game.t += dt;

  if(p.hp<=0){
    Game.state='GAMEOVER';
    AudioSys.stopLoop();
    AudioSys.sfx.gameover();
  } else if(m.dead){
    Game.state='WIN';
    AudioSys.stopLoop();
    AudioSys.sfx.victory();
    if(!Game.winTriggered){
      Game.winTriggered = true;
      Game.confetti = [];
      const colors = [PAL.hpRed, '#e8c840', PAL.uiLight, '#4a9cff', '#ff8fd0'];
      for(let i=0;i<60;i++){
        Game.confetti.push({
          x: Math.random()*W, y: -20 - Math.random()*200,
          vy: 40 + Math.random()*60, vx: (Math.random()-0.5)*40,
          size: 3 + Math.random()*4,
          color: colors[Math.floor(Math.random()*colors.length)],
          spin: Math.random()*6
        });
      }
    }
  }
}

function updateEncounterIntro(dt){
  Game.t += dt;
  if(Game.t > 0.9){
    Game.state='WILD_BATTLE';
    Game.t = 0;
  }
}

function updateWildBattle(dt){
  updatePlayer(dt);
  const p = Game.player, c = Game.wildCritter;
  if(!c) { Game.state='EXPLORE'; return; }

  if(down('z')) tryAttack();
  if(down('x')){
    if(Game.apples>0 && p.hp < p.maxHp){
      Game.apples--; p.hp = Math.min(p.maxHp, p.hp+30);
      AudioSys.sfx.heal();
      Game.showMessage("Ate an apple! +30 HP", 1.2);
      keys['x']=false;
    }
  }

  if(!c.dead){
    const dx = p.x - c.x, dy = p.y - c.y;
    const d = Math.hypot(dx,dy) || 1;
    if(d>34){
      c.x += (dx/d)*1.3*dt*60;
      c.y += (dy/d)*1.3*dt*60;
    }
    c.attackCd = (c.attackCd||0) - dt;
    if(d<40 && c.attackCd<=0){
      c.attackCd = 1.2;
      p.hp = Math.max(0, p.hp - c.dmg);
      p.hurtT = 0.35;
      Game.shake = 6;
      AudioSys.sfx.hurt();
    }
  }

  if(Game.messageT>0) Game.messageT -= dt;
  Game.t += dt;

  if(p.hp<=0){
    Game.state='GAMEOVER';
    AudioSys.stopLoop();
    AudioSys.sfx.gameover();
  } else if(c.dead){
    if(c.reward==='stick') Game.sticks++;
    if(c.reward==='stone') Game.stones++;
    if(c.reward==='apple') Game.apples++;
    Game.craftCheck();
    AudioSys.sfx.pickup();
    Game.showMessage(`Defeated the ${c.name}! Found a ${c.reward}.`, 2.2);
    Game.wildCritter = null;
    Game.battleMode = 'monster';
    Game.encounterCooldown = 6;
    Game.state = 'EXPLORE';
  }
}

function updateConfetti(dt){
  for(const c of Game.confetti){
    c.y += c.vy*dt;
    c.x += c.vx*dt;
    c.vy += 30*dt;
    if(c.y > H+20){ c.y = -20; c.x = Math.random()*W; c.vy = 40+Math.random()*60; }
  }
}

// ---------- RENDER ----------
function drawBackground(night){
  ctx.fillStyle = night ? PAL.bgSkyNight : PAL.bgSkyDay;
  ctx.fillRect(0,0,W,H);
  // ground checker
  const tile=24;
  for(let y=0;y<H;y+=tile){
    for(let x=0;x<W;x+=tile){
      const idx = ((x/tile)+(y/tile))%2;
      ctx.fillStyle = night ? (idx? PAL.groundNight1: PAL.groundNight2) : (idx? PAL.groundDay1: PAL.groundDay2);
      ctx.fillRect(x,y,tile,tile);
    }
  }
  if(night){
    // stars
    ctx.fillStyle='rgba(255,255,255,0.6)';
    for(let i=0;i<26;i++){
      const sx = (i*47)%W, sy=(i*89)%180 + 10;
      ctx.fillRect(sx,sy,2,2);
    }
    // moon
    ctx.fillStyle = '#e8e8d0';
    ctx.fillRect(W-70,20,26,26);
    ctx.fillStyle = PAL.bgSkyNight;
    ctx.fillRect(W-64,16,26,26);
  } else {
    // sun
    ctx.fillStyle='#e8c840';
    ctx.fillRect(W-60,16,24,24);
  }
}

function drawTree(tr){
  px(tr.x+tr.w/2-6, tr.y+tr.h-24, 12, 24, PAL.trunk);
  px(tr.x+tr.w/2-6, tr.y+tr.h-24, 4, 24, PAL.trunkDark);
  px(tr.x, tr.y, tr.w, tr.h-18, PAL.leaf2);
  px(tr.x+6, tr.y+6, tr.w-12, tr.h-30, PAL.leaf1);
  px(tr.x+10, tr.y+10, tr.w-24, tr.h-40, PAL.leaf3);
}

function drawPath(p){
  px(p.x,p.y,p.w,p.h, PAL.dirt);
  for(let i=0;i<p.w+p.h;i+=14){
    px(p.x+(i%p.w),p.y+((i*3)%Math.max(p.h,1)),3,3,PAL.dirtDark);
  }
}
function drawPond(p,t){
  px(p.x,p.y,p.w,p.h, PAL.waterDark);
  px(p.x+2,p.y+2,p.w-4,p.h-4, PAL.water);
  const shimmer = Math.floor((t*2)%3);
  for(let i=0;i<4;i++){
    px(p.x+8+i*16, p.y+8+((i+shimmer)%3)*8, 8,2, PAL.waterHi);
  }
}
function drawRock(r){
  px(r.x,r.y+4,r.w,r.h-4, PAL.stone);
  px(r.x+2,r.y+4,r.w-4,3, PAL.stoneHi);
  px(r.x,r.y+r.h-2,r.w,3,PAL.outline);
}
function drawFlower(x,y,t){
  const sway = Math.sin(t*2+x)*1;
  px(x+2,y+3,1,4,PAL.leaf1);
  const cx=x+2+sway;
  px(cx-2,y,2,2,PAL.appleLeaf==='#3f8f3f'?'#e0684f':'#e0684f');
  px(cx+1,y,2,2,'#ffe066');
  px(cx-2,y+2,2,2,'#f4f4e4');
  px(cx+1,y+2,2,2,'#e0684f');
}
function drawGrassPatch(g,night,t){
  const base = night ? PAL.grassNight : PAL.grassDay;
  const hi = night ? PAL.grassNightHi : PAL.grassDayHi;
  px(g.x,g.y,g.w,g.h, base);
  const sway = Math.sin(t*3)*1.5;
  for(let y=0; y<g.h; y+=8){
    for(let x=0; x<g.w; x+=8){
      const off = ((x+y)%16===0) ? sway : -sway;
      px(g.x+x+off, g.y+y, 3, 6, hi);
    }
  }
}

function drawHPBar(x,y,w,h,hp,maxHp,label){
  const pct = clamp(hp/maxHp,0,1);
  ctx.fillStyle = '#0a1a0a';
  ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle = '#1a2a1a';
  ctx.fillRect(x,y,w,h);
  const col = pct>0.5?PAL.hpGreen:(pct>0.2?PAL.hpYellow:PAL.hpRed);
  ctx.fillStyle = col;
  ctx.fillRect(x,y,w*pct,h);
  ctx.fillStyle = PAL.white;
  ctx.font = '10px monospace';
  ctx.fillText(label, x, y-4);
  ctx.fillText(Math.ceil(hp)+"/"+maxHp, x+w+6, y+h-1);
}

function drawHUDBoxText(lines, x, y, w){
  const h = 16 + lines.length*14;
  ctx.fillStyle = 'rgba(15,15,15,0.85)';
  ctx.fillRect(x,y,w,h);
  ctx.strokeStyle = PAL.uiLight;
  ctx.lineWidth=2;
  ctx.strokeRect(x,y,w,h);
  ctx.fillStyle = PAL.uiLight;
  ctx.font='12px monospace';
  lines.forEach((l,i)=>ctx.fillText(l, x+10, y+20+i*14));
}

function render(){
  const night = (Game.state==='NIGHT_INTRO'||Game.state==='COMBAT'||Game.state==='WIN'||Game.state==='GAMEOVER');

  ctx.save();
  if(Game.shake>0){
    ctx.translate((Math.random()-0.5)*Game.shake, (Math.random()-0.5)*Game.shake);
    Game.shake = Math.max(0, Game.shake-1.2);
  }

  if(Game.state==='NAME_ENTRY'){
    drawNameBackdrop();
    ctx.restore();
    return;
  }

  if(Game.state==='TITLE'){
    drawTitle();
    ctx.restore();
    return;
  }

  drawBackground(night);
  path.forEach(drawPath);
  drawPond(pond, Game.t);
  rocks.forEach(drawRock);
  if(!night) flowers.forEach(f=>drawFlower(f.x,f.y,Game.t));
  grassPatches.forEach(g=>drawGrassPatch(g, night, Game.t));
  trees.forEach(drawTree);

  if(Game.state==='EXPLORE'){
    // items
    for(const it of Game.items){
      if(it.taken) continue;
      if(it.type==='stick') drawStick(it.x,it.y);
      if(it.type==='stone') drawStone(it.x,it.y);
      if(it.type==='apple') drawApple(it.x,it.y);
    }
    if(!Game.friend.found){
      drawMan(Game.friend.fx, Game.friend.fy, 'down', Game.t, false);
      // bush overlay hinting hidden friend
      px(Game.friend.fx-4, Game.friend.fy+30, 56, 14, PAL.bush);
    }
  }

  if(Game.friend.active){
    drawMan(Game.friend.x, Game.friend.y, Game.friend.facing, Game.friend.walkT, Game.friend.fainted);
  }

  drawGirl(Game.player.x, Game.player.y, Game.player.facing, Game.player.walkT, Game.player.attackT>0.15, Game.hasSword, false);

  if(Game.monster.active && !Game.monster.dead){
    drawMonster(Game.monster.x, Game.monster.y, Game.t, 1);
  }

  if((Game.state==='WILD_BATTLE'||Game.state==='ENCOUNTER_INTRO') && Game.wildCritter && !Game.wildCritter.dead){
    drawCritter(Game.wildCritter, Game.t);
  }

  // ---- HUD ----
  if(Game.state==='EXPLORE'){
    drawHUDBoxText([
      `STICKS:${Game.sticks}  STONES:${Game.stones}  APPLES:${Game.apples}`,
      `${Game.hasSword? 'SWORD READY!':'Need 2 sticks + 1 stone'}`,
    ], 8, 8, 300);
    // day timer bar
    const pct = clamp(Game.dayTimer/55,0,1);
    ctx.fillStyle='rgba(15,15,15,0.85)';
    ctx.fillRect(W-160,8,152,26);
    ctx.strokeStyle=PAL.uiLight; ctx.strokeRect(W-160,8,152,26);
    ctx.fillStyle = pct>0.3? '#e8c840':'#c0392b';
    ctx.fillRect(W-154,14,140*pct,14);
    ctx.fillStyle=PAL.uiLight; ctx.font='10px monospace';
    ctx.fillText('DAYLIGHT REMAINING', W-154, 40+6);
  }

  if(Game.state==='COMBAT' || Game.state==='NIGHT_INTRO'){
    drawHPBar(10, 20, 130, 12, Game.player.hp, Game.player.maxHp, (Game.playerName || 'YOU').toUpperCase().slice(0,10));
    if(Game.friend.active) drawHPBar(10, 56, 130, 12, Game.friend.hp, Game.friend.maxHp, 'FRIEND');
    if(Game.monster.active) drawHPBar(W-160, 20, 140, 14, Game.monster.hp, Game.monster.maxHp, 'MONSTER');
  }
  if(Game.state==='WILD_BATTLE' && Game.wildCritter){
    drawHPBar(10, 20, 130, 12, Game.player.hp, Game.player.maxHp, (Game.playerName || 'YOU').toUpperCase().slice(0,10));
    drawHPBar(W-160, 20, 140, 14, Game.wildCritter.hp, Game.wildCritter.maxHp, Game.wildCritter.name.slice(0,12));
  }
  if(Game.state==='COMBAT' || Game.state==='WILD_BATTLE'){
    drawHUDBoxText([`APPLES:${Game.apples}  ${Game.hasSword? 'SWORD (15dmg)':'FISTS (5dmg)'}`], 8, H-40, 200);
    drawBattleMenu(Game.state==='WILD_BATTLE');
  }

  if(Game.player.hurtT>0){
    ctx.fillStyle='rgba(200,20,20,0.15)';
    ctx.fillRect(0,0,W,H);
  }

  if(Game.state==='ENCOUNTER_INTRO'){
    // Fire Red style flashing wipe transition
    const flash = Math.abs(Math.sin(Game.t*22));
    ctx.fillStyle = `rgba(232,200,64,${flash*0.5})`;
    ctx.fillRect(0,0,W,H);
    for(let i=-2;i<10;i++){
      const stripeX = ((Game.t*900)%(W+120)) - 60 + i*60;
      ctx.fillStyle='rgba(10,10,10,0.55)';
      ctx.fillRect(stripeX,0,30,H);
    }
    ctx.fillStyle=PAL.white;
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.fillText('!', W/2, H/2);
    ctx.textAlign='left';
  }

  if(Game.state==='NIGHT_INTRO'){
    ctx.fillStyle='rgba(0,0,0,'+clamp(Game.t/2.2*0.7,0,0.7)+')';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle=PAL.white;
    ctx.font='bold 20px monospace';
    ctx.textAlign='center';
    ctx.fillText('NIGHT FALLS...', W/2, H/2);
    ctx.textAlign='left';
  }

  if(Game.messageT>0 && Game.state!=='NIGHT_INTRO'){
    ctx.fillStyle='rgba(15,15,15,0.85)';
    ctx.fillRect(W/2-190, H-70, 380, 30);
    ctx.strokeStyle=PAL.uiLight; ctx.strokeRect(W/2-190, H-70, 380, 30);
    ctx.fillStyle=PAL.uiLight;
    ctx.font='12px monospace';
    ctx.textAlign='center';
    ctx.fillText(Game.message, W/2, H-50);
    ctx.textAlign='left';
  }

  if(Game.state==='WIN'){
    ctx.fillStyle='rgba(10,20,10,0.75)';
    ctx.fillRect(0,0,W,H);

    // confetti behind text
    for(const c of Game.confetti){
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate((Game.t*c.spin)%(Math.PI*2));
      ctx.fillStyle = c.color;
      ctx.fillRect(-c.size/2, -c.size/2, c.size, c.size);
      ctx.restore();
    }

    ctx.fillStyle=PAL.white; ctx.font='bold 22px monospace'; ctx.textAlign='center';
    ctx.fillText(`${(Game.playerName||'YOU').toUpperCase()} SURVIVED THE NIGHT!`, W/2, H/2-58);

    // Happy Friendship Day banner
    const pulse = 1 + Math.sin(Game.t*3)*0.06;
    ctx.save();
    ctx.translate(W/2, H/2-16);
    ctx.scale(pulse, pulse);
    ctx.fillStyle='#ffe066';
    ctx.font='bold 22px monospace';
    ctx.fillText('💛 HAPPY FRIENDSHIP DAY 💛', 0, 0);
    ctx.restore();

    ctx.font='13px monospace';
    ctx.fillStyle=PAL.white;
    ctx.fillText('You and your friend made it through, together.', W/2, H/2+16);
    ctx.font='11px monospace';
    ctx.fillStyle='#cfcfcf';
    ctx.fillText('Press ENTER to play again', W/2, H/2+46);
    ctx.textAlign='left';
  }
  if(Game.state==='GAMEOVER'){
    ctx.fillStyle='rgba(30,5,5,0.8)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#e05050'; ctx.font='bold 22px monospace'; ctx.textAlign='center';
    ctx.fillText(`${(Game.playerName||'YOU').toUpperCase()}, THE JUNGLE CLAIMS YOU...`, W/2, H/2-20);
    ctx.font='11px monospace'; ctx.fillStyle=PAL.white;
    ctx.fillText('Press ENTER to try again', W/2, H/2+16);
    ctx.textAlign='left';
  }

  ctx.restore();
}

function drawNameBackdrop(){
  ctx.fillStyle = PAL.bgSkyNight;
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#0e2414';
  for(let i=0;i<10;i++){
    ctx.fillRect(i*50, H-140-((i%3)*14), 40, 140+((i%3)*14));
  }
  ctx.fillStyle='#16341c';
  for(let i=0;i<8;i++){
    ctx.fillRect(20+i*60, H-90, 30, 90);
  }
  drawGirl(W/2-8*3, H-190, 'down', performance.now()/500, false, false, false);
  ctx.fillStyle=PAL.uiLight;
  ctx.textAlign='center';
  ctx.font='bold 20px monospace';
  ctx.fillText('JUNGLE NIGHT', W/2, 90);
  ctx.textAlign='left';
}

function drawTitle(){
  ctx.fillStyle = PAL.bgSkyNight;
  ctx.fillRect(0,0,W,H);
  // simple parallax jungle silhouette
  ctx.fillStyle = '#0e2414';
  for(let i=0;i<10;i++){
    ctx.fillRect(i*50, H-140-((i%3)*14), 40, 140+((i%3)*14));
  }
  ctx.fillStyle='#16341c';
  for(let i=0;i<8;i++){
    ctx.fillRect(20+i*60, H-90, 30, 90);
  }
  drawMonster(W/2-9*3, 60, performance.now()/500, 1.1);

  ctx.fillStyle=PAL.uiLight;
  ctx.textAlign='center';
  ctx.font='bold 30px monospace';
  ctx.fillText('JUNGLE NIGHT', W/2, 210);
  ctx.font='11px monospace';
  ctx.fillText('a Game Boy style survival tale', W/2, 232);

  ctx.font='12px monospace';
  ctx.fillStyle='#9bbc0f';
  ctx.fillText(`Starring: ${Game.playerName || 'Explorer'}`, W/2, 254);

  const blink = Math.sin(performance.now()/300) > 0;
  if(blink){
    ctx.font='14px monospace';
    ctx.fillStyle = '#e8c840';
    ctx.fillText('PRESS ENTER TO START', W/2, 300);
  }

  ctx.font='10px monospace';
  ctx.fillStyle='#7a9a7a';
  ctx.fillText('ARROWS/WASD move   Z attack   X eat apple   R run   M mute', W/2, 340);
  ctx.fillText('Find your friend. Craft a sword. Watch the tall grass.', W/2, 358);
  ctx.textAlign='left';
}

// ---------- MAIN LOOP ----------
let lastTime = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now-lastTime)/1000);
  lastTime = now;

  if(Game.state==='EXPLORE') updateExplore(dt);
  else if(Game.state==='ENCOUNTER_INTRO') updateEncounterIntro(dt);
  else if(Game.state==='WILD_BATTLE') updateWildBattle(dt);
  else if(Game.state==='NIGHT_INTRO') updateNightIntro(dt);
  else if(Game.state==='COMBAT') updateCombat(dt);
  else if(Game.state==='WIN'){ Game.t += dt; updateConfetti(dt); }
  else Game.t += dt;

  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
